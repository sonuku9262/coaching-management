<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" fill="none">
  <!-- soft background -->
  <ellipse cx="260" cy="215" rx="240" ry="165" fill="#dbeafe"/>
  <ellipse cx="260" cy="215" rx="190" ry="130" fill="#eff6ff"/>

  <!-- whiteboard -->
  <rect x="130" y="70" width="260" height="150" rx="10" fill="#ffffff" stroke="#93c5fd" stroke-width="4"/>
  <rect x="150" y="92" width="120" height="10" rx="5" fill="#bfdbfe"/>
  <rect x="150" y="114" width="180" height="10" rx="5" fill="#bfdbfe"/>
  <rect x="150" y="136" width="150" height="10" rx="5" fill="#bfdbfe"/>
  <path d="M310 160 l22 30 12 -16 20 26" stroke="#2563eb" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="352" cy="104" r="16" fill="#fbbf24"/>
  <path d="M346 104 l5 5 9 -10" stroke="#ffffff" stroke-width="3.5" fill="none" stroke-linecap="round"/>

  <!-- teacher -->
  <g transform="translate(84 168)">
    <circle cx="30" cy="26" r="22" fill="#fde68a"/>
    <path d="M8 26 a22 22 0 0 1 44 0 l-4 -17 a20 20 0 0 0 -36 0 Z" fill="#374151"/>
    <path d="M4 120 q4 -58 26 -58 q22 0 26 58 Z" fill="#2563eb"/>
    <rect x="44" y="66" width="44" height="9" rx="4.5" fill="#fbbf24" transform="rotate(-28 44 66)"/>
  </g>

  <!-- students sitting -->
  <g transform="translate(220 268)">
    <circle cx="22" cy="16" r="16" fill="#fde68a"/>
    <path d="M6 16 a16 16 0 0 1 32 0 l-3 -12 a14 14 0 0 0 -26 0 Z" fill="#1f2937"/>
    <path d="M0 74 q4 -40 22 -40 q18 0 22 40 Z" fill="#16a34a"/>
  </g>

  <g transform="translate(310 268)">
    <circle cx="22" cy="16" r="16" fill="#fecaca"/>
    <path d="M4 20 a17 16 0 0 1 36 -4 q6 16 -2 18 l-2 -10 a14 14 0 0 1 -28 0 Z" fill="#7c2d12"/>
    <path d="M0 74 q4 -40 22 -40 q18 0 22 40 Z" fill="#dc2626"/>
  </g>

  <g transform="translate(400 268)">
    <circle cx="22" cy="16" r="16" fill="#fde68a"/>
    <path d="M6 16 a16 16 0 0 1 32 0 l-3 -12 a14 14 0 0 0 -26 0 Z" fill="#374151"/>
    <path d="M0 74 q4 -40 22 -40 q18 0 22 40 Z" fill="#7c3aed"/>
  </g>

  <!-- floating books -->
  <g transform="translate(52 84) rotate(-10)">
    <rect x="0" y="0" width="52" height="12" rx="3" fill="#dc2626"/>
    <rect x="4" y="-12" width="52" height="12" rx="3" fill="#2563eb"/>
    <rect x="8" y="-24" width="52" height="12" rx="3" fill="#16a34a"/>
  </g>

  <!-- stars -->
  <path d="M440 90 l4 9 9 4 -9 4 -4 9 -4 -9 -9 -4 9 -4 Z" fill="#fbbf24"/>
  <circle cx="470" cy="150" r="5" fill="#93c5fd"/>
  <circle cx="60" cy="240" r="6" fill="#93c5fd"/>
</svg>
